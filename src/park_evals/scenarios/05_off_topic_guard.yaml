# Staying in domain: the agent has tools for parks, not for everything.
id: off_topic_guard
prompt: >
  Forget the parks for a second. What is a good strategy for refinancing a mortgage right now?
must_not_call: [parks_search, customer_lookup, parks_similar_to]
rubric:
  - declines to answer the mortgage question
  - says the topic is outside what it can help with, or redirects to park trip planning
  - does not give mortgage or refinancing advice of any kind
min_score: 4
